name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check changed-file formatting
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run format:check -- --base "$FORMAT_BASE"

  drawer:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        react: ["18.3.1", "19.3.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Select React version
        env:
          REACT_VERSION: ${{ matrix.react }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          const { readFileSync } = require('node:fs');
          const { createRequire } = require('node:module');
          const { resolve } = require('node:path');
          const roots = [require, createRequire(resolve('apps/playground/package.json'))];
          const packages = ['react', 'react-dom'];
          const version = (from, name) => JSON.parse(readFileSync(from.resolve(`${name}/package.json`))).version;
          const expected = process.env.REACT_VERSION;
          if (!roots.every(from => packages.every(name => version(from, name) === expected))) {
            // --no-save preserves the manifests while still reading the lockfile.
            execFileSync('npm', ['install', '--no-save', '--workspace', '@jev-devtools/playground', '--include-workspace-root', ...packages.map(name => `${name}@${expected}`)], { stdio: 'inherit' });
          }
          for (const [index, from] of roots.entries()) {
            for (const name of packages) {
              assert.equal(version(from, name), expected);
              console.log(`${index === 0 ? 'root' : 'playground'} ${name}: ${expected}`);
            }
          }
          NODE
      # Use the runner image's system libraries; keep Playwright's pinned browser.
      - run: npx playwright install chromium --only-shell
      - run: npm run verify:drawer
      - run: npm run verify:flows
      - run: npm run verify:cookbooks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-browser-react-${{ matrix.react }}-${{ github.sha }}
          path: |
            benchmarks/results/flows/**/*.png
            benchmarks/results/flows/**/server.log
          if-no-files-found: ignore
          retention-days: 7

  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", "24"]
        react: ["18.3.1", "19.3.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run check:playground
      - run: npm run verify:package
        env:
          JEV_VERIFY_REACT: ${{ matrix.react }}
      - run: git diff --check

  nextjs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify:nextjs
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Match drawer verification: use ubuntu-24.04's system libraries and the pinned browser.
      - run: npx playwright install chromium --only-shell
      - run: npm run build:package
      - run: npm run verify:docs
      # Preview artifacts are review evidence, never an automatic deployment.
      - uses: actions/upload-artifact@v4
        with:
          name: docs-preview-${{ github.sha }}
          path: apps/docs/dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docs-browser-failure-${{ github.sha }}
          path: benchmarks/results/docs/
          if-no-files-found: ignore
          retention-days: 7

  landing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm --prefix landing ci
      - run: npm --prefix landing test
      - run: npm --prefix landing run build
