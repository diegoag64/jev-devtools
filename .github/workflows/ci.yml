name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  drawer:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        react: ["18.3.1", "19.3.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Select React version
        env:
          REACT_VERSION: ${{ matrix.react }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          const { readFileSync } = require('node:fs');
          const packages = ['react', 'react-dom'];
          const version = name => JSON.parse(readFileSync(require.resolve(`${name}/package.json`))).version;
          const expected = process.env.REACT_VERSION;
          if (!packages.every(name => version(name) === expected)) {
            // --no-save preserves the manifests while still reading the lockfile.
            execFileSync('npm', ['install', '--no-save', ...packages.map(name => `${name}@${expected}`)], { stdio: 'inherit' });
          }
          for (const name of packages) {
            assert.equal(version(name), expected);
            console.log(`${name}: ${expected}`);
          }
          NODE
      # Use the runner image's system libraries; keep Playwright's pinned browser.
      - run: npx playwright install chromium --only-shell
      - run: npm run verify:drawer

  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", "24"]
        react: ["18.3.1", "19.3.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run check:playground
      - run: npm run verify:package
        env:
          JEV_VERIFY_REACT: ${{ matrix.react }}
      - run: git diff --check

  nextjs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify:nextjs
        env:
          NEXT_TELEMETRY_DISABLED: "1"
