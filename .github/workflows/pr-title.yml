name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      # Read metadata only: no checkout, dependencies, secrets or PR code.
      # Pass the title as data rather than interpolating it into shell code.
      - name: Validate conventional title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node <<'NODE'
          const title = process.env.PR_TITLE ?? '';
          const pattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9./_-]*\))?!?: \S[^\r\n]*$/u;
          if (!pattern.test(title) || title.trim() !== title) {
            console.error('Use type: description, e.g. feat: add flow loops or fix: preserve diagram zoom.');
            console.error('Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert.');
            console.error('Optional scope and breaking-change marker: fix(viewer): restore focus or feat!: change the flow API.');
            process.exit(1);
          }
          console.log('PR title follows the required format.');
          NODE
